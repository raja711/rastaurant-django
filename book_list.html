<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book List</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            padding-top: 50px;
            min-height: 100vh;
        }

        .container {
            width: 800px;
            background-color: #ffffff;
            padding: 40px 50px;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            border: 1px solid #e0e0e0;
            align-self: flex-start;
        }

        h2 {
            text-align: center;
            font-size: 24px;
            color: #333333;
            margin-bottom: 35px;
            font-weight: bold;
        }

        .book-item {
            padding-bottom: 15px;
            margin-bottom: 15px;
            border-bottom: 1px solid #eeeeee;
        }

        .book-item:last-child {
            border-bottom: 1px solid #eeeeee;
        }

        .book-title {
            color: #4CAF50;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .book-author {
            font-size: 13px;
            color: #333333;
        }

        .book-author strong {
            font-weight: bold;
            color: #000000;
        }

        .no-books {
            text-align: center;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Book List</h2>

{% for book in books %}
    <div class="book-item">
        <!-- URL pattern me 'book_detail' name aur 'book.id' argument pass karein -->
        <a href="{% url 'book_detail' book.id %}" style="text-decoration: none;">
            <div class="book-title">{{ book.title }}</div>
        </a>
        <div class="book-author"><strong>Author:</strong> {{ book.author }}</div>
    </div>
{% empty %}
    <p class="no-books">No books available in the catalog.</p>
{% endfor %}
    </div>

</body>
</html>
