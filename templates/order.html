    <body style="background-color:skyblue;">





    <div class="container  " style="margin-top: 100px; border-radius: 2rem;">

        <div class="row">

            <div class="col-sm-3"></div>
            <div class="col-sm-6">

                <div class="card w-100" style=" border: 5px solid rgb(6, 193, 255); border-radius: 2rem;">
                    <div class="card-header text-bg-dark" style="border-radius: 2rem; margin-top: 10px;">
                        <center>
                        <h4 style="color: red; border: 2px solid red; border-radius: 2rem; width: 300px;height: 50px; text-color:red; margin-top: 10px;">Order Now</h4>
                    </center>
                    </div>
                    <div class="card-body">

                        <form id="orderform">

                            <div class="form-group">
                               <center> <label>Enter Name</label></center>
                                <input type="text" id="name" class="form-control" required style="color: red; border: 2px solid red; border-radius: 2rem; width: 600px;"/>
                            </div>
                            <div class="form-group">
                                <center><label>Enter Mobile</label></center>
                                <input type="number" id="mobile" class="form-control" required style="color: red; border: 2px solid red; border-radius: 2rem; width: 600px;"/>
                            </div>
                            <div class="form-group">
                               <center> <label>Enter Email</label></center>
                                <input type="email" id="email" class="form-control" required style="color: red; border: 2px solid red; border-radius: 2rem; width: 600px;"/>
                            </div>
                            <div class="form-group">
                               <center> <label>Enter Amount</label></center>
                                <input type="number" id="amount" class="form-control" required style="color: red; border: 2px solid red; border-radius: 2rem; width: 600px;"/>
                            </div>
                            <div class="form-group mt-3"><center>
                                <button class="btn btn-primary" style="color: red; border: 2px solid red; border-radius: 2rem; width: 100px;">Pay Now</button>
                            </center>
                            </div>

                        </form>

                    </div>
                </div>

            </div>

        </div>

    </div>


    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script>

        $(document).ready(function(){

            $("#orderform").submit(function(e){
                e.preventDefault();

                var amt = $("#amount").val();


                $.ajax({
                    url: "https://phpcrud.himanshukashyap.com/rzp/createOrder.php?amount="+amt,
                    type:"get",
                    error:function(){
                        alert("Error in ajax");
                    },
                    success:function(data){
                        var token = data.token;
                        var key = data.key;

// Configure all parameters for payment
var options = {
                            "key": key,
                            "amount": amt*100,
                            "currency": "INR",
                            "name": "Restaurants",
                            "description": "Test Transaction",
                            "image": "features-icon-3.jpg",
                            "order_id": token,
                            "callback_url": "https://eneqd3r9zrjok.x.pipedream.net/",
                            "prefill": {
                                "name": $("#name").val(),
                                "email": $("#email").val(),
                                "contact": $("#mobile").val()
                            },
                            "notes": {
                                "address": "DigiCoders Technologies Private Limited, Lucknow, UP"
                            },
                            "theme": {
                                "color": "#3399cc"
                            },

                            // Handle Success Response
                            "handler": function(response) {
                                alert("Payment Success");
                                window.location.href="success.html";
                            }
                        };

                        // Initialize Razorpay SDK
                        var rzp1 = new Razorpay(options);

                        // Open Razorpay
                        rzp1.open();


                        // Handle Payment Fail Response
                        rzp1.on('payment.failed', function (response){
                            alert("Payment Failed");
                            window.location.href="failed.html";
                        });

                    }




                });
            });

        });

    </script>
     <!-- Template Javascript -->
       <script src="{% static 'js/main.js' %}"></script>

</body>
</html>
