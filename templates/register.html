<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 360px;
            background-color: white;
            padding: 30px 25px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
        }
        h2 {
            color: #000;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: bold;
            text-align: left;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            font-size: 15px;
            color: #333;
            margin-bottom: 6px;
            display: block;
        }
        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            background-color: #fff;
        }
        input:focus {
            border-color: #337ab7;
        }
        .btn-submit {
            width: 100%;
            padding: 10px;
            background-color: #337ab7;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn-submit:hover {
            background-color: #286090;
        }
        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
        .footer-text a {
            color: #3b00e4;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Registration</h2>

        {% if messages %}
            {% for message in messages %}
                <div style="padding: 8px; background-color: #f8d7da; color: #721c24; border-radius: 4px; margin-bottom: 15px; text-align: center; font-size: 14px;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form id="regForm" method="POST" action="" autocomplete="off">
            {% csrf_token %}

            <!-- Dummy Hidden Input to fool browser autofill -->
            <input type="text" style="display:none;" aria-hidden="true">
            <input type="password" style="display:none;" aria-hidden="true">

            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" autocomplete="off" readonly onfocus="this.removeAttribute('readonly');" required>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" autocomplete="off" required>
            </div>

            <div class="form-group">
                <label for="full_name">Full Name:</label>
                <input type="text" id="full_name" name="full_name" autocomplete="off" required>
            </div>

            <button type="submit" class="btn-submit">Register</button>
        </form>

        <div class="footer-text">
            <a href="{% url 'login' %}">Already have an account? Login here</a>
        </div>
    </div>

    <script>
        // Refresh karne par form values force clear karne ke liye
        window.addEventListener('load', function() {
            document.getElementById('regForm').reset();
        });

        window.addEventListener('pageshow', function() {
            document.getElementById('regForm').reset();
        });
    </script>

</body>
</html>
