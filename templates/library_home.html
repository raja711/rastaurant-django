<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the Library Catalog</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #333;
        }
        .header {
            text-align: center;
            padding: 25px 20px 10px 20px;
        }
        .header h1 {
            font-size: 26px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 20px;
        }
        .nav-links a {
            color: #5cb85c;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }
        .subtext {
            font-size: 13px;
            color: #333;
            margin-bottom: 20px;
            padding-left: 20px;
        }
        .gray-box {
            width: 100%;
            height: 420px;
            background-color: #f2f2f2;
            border-top: 1px solid #e5e5e5;
            border-bottom: 1px solid #e5e5e5;
            margin-bottom: 30px;
        }
        .divider-line {
            width: 100%;
            border-top: 1px solid #e0e0e0;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Welcome to the Library Catalog</h1>

        <div class="nav-links">
            <a href="../add_book">Add New Book</a>
            <a href="../book_list">Book List</a>
            <a href="../update_book">Update Book</a>
        </div>
    </div>

    <p class="subtext">Explore our catalog and manage your books effectively. Use the navigation links to perform various actions.</p>

    <div class="gray-box"></div>

    <div class="divider-line"></div>

</body>
</html>
