<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            padding-top: 50px;
            min-height: 100vh;
        }

        .container {
            width: 800px;
            background-color: #ffffff;
            padding: 40px 50px;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            border: 1px solid #e0e0e0;
            align-self: flex-start;
        }

        h2 {
            text-align: center;
            font-size: 24px;
            color: #333333;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .book-title {
            color: #000000;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .book-info {
            font-size: 13px;
            color: #333333;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .book-info strong {
            font-weight: bold;
            color: #000000;
        }

        .back-link {
            text-align: center;
            margin-top: 35px;
        }

        .back-link a {
            color: #4CAF50;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Book Details</h2>

        <div class="book-title">{{ book.title }}</div>
        <div class="book-info"><strong>Author:</strong> {{ book.author }}</div>
        <div class="book-info"><strong>Description:</strong> {{ book.description }}</div>

        <div class="back-link">
            <a href="../book_list">Back to Book List</a>
        </div>
    </div>

</body>
</html>
